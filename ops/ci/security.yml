name: Production checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=moderate
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: oraliq_test
          POSTGRES_PASSWORD: local-ci-test-only
          POSTGRES_DB: oraliq_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U oraliq_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://oraliq_test:local-ci-test-only@localhost:5432/oraliq_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-test.txt pip-audit
      - run: pytest app/tests -q --disable-warnings
      - run: pytest ../ops/backup/tests -q --disable-warnings
      - run: pip-audit --progress-spinner off
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t oraliq-security-check ./backend
      - run: docker run --rm --entrypoint sh oraliq-security-check -c 'test "$(id -u)" != "0" && python -m pip check'
      - run: docker run --rm --entrypoint python oraliq-security-check -c 'import cv2, av, torch, transformers; from sentence_transformers import SentenceTransformer; from insightface.app import FaceAnalysis; print("Model libraries import successfully")'
      - run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL oraliq-security-check
