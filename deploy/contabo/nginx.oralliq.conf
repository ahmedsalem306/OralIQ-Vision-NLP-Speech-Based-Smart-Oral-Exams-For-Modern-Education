# Install only after DNS and certificate issuance; see oralliq-cutover.md.
server {
    listen 80;
    listen [::]:80;
    server_name api.oralliq.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/oraliq-acme;
    }
    location / {
        return 301 https://api.oralliq.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.oralliq.com;
    ssl_certificate /etc/letsencrypt/live/api.oralliq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.oralliq.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50m;

    # Do not add request bodies, authorization headers or query strings to logs.
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:18001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace client-supplied forwarding headers before the trusted API hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
