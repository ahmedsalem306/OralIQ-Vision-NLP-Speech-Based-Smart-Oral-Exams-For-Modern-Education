# Install after DNS validation and frontend certificate issuance.
map $request_uri $oraliq_search_directive {
    default "";
    ~^/(login|register|verify-email|exam|dashboard|app\.html|service-status\.json)(/|\?|$) "noindex, nofollow";
}
server {
    listen 80;
    listen [::]:80;
    server_name oralliq.com www.oralliq.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/oraliq-acme; }
    location / { return 301 https://oralliq.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.oralliq.com;
    ssl_certificate /etc/letsencrypt/live/oralliq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oralliq.com/privkey.pem;
    access_log off;
    return 301 https://oralliq.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name oralliq.com;
    ssl_certificate /etc/letsencrypt/live/oralliq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oralliq.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/oraliq-web/current;
    index index.html;
    access_log off;
    client_max_body_size 50m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy 'camera=(self), microphone=(self), geolocation=()' always;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag $oraliq_search_directive always;
    location = /service-status.json {
        default_type application/json;
        if (-f /srv/oraliq-web/accounts-maintenance) { return 200 '{"accounts_available":false,"exams_available":false}'; }
        if (-f /srv/oraliq-web/api-maintenance) { return 200 '{"accounts_available":true,"exams_available":false}'; }
        return 200 '{"accounts_available":true,"exams_available":true}';
    }
    # Account access can open independently of exams and paid checkout.
    location ~ ^/api/v1/(register|login/(access-token|google)|auth/(google/config|verify-email|resend-verification|email-verification/request)|users/me|billing/(plans|status))/?$ {
        if (-f /srv/oraliq-web/accounts-maintenance) { return 503; }
        error_page 503 = @oraliq_maintenance;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        proxy_pass http://127.0.0.1:18001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
    location /api/ {
        # This marker keeps exam, biometric and payment operations paused.
        if (-f /srv/oraliq-web/api-maintenance) { return 503; }
        error_page 503 = @oraliq_maintenance;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        proxy_pass http://127.0.0.1:18001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
    location @oraliq_maintenance {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        if (-f /srv/oraliq-web/accounts-maintenance) { return 503 '{"detail":{"code":"SERVICE_MAINTENANCE","message":"التسجيل والدخول متوقفان مؤقتًا أثناء تجهيز الخدمة. حاول لاحقًا.","message_en":"Registration and sign-in are temporarily paused while we prepare the service. Please try later."}}'; }
        return 503 '{"detail":{"code":"EXAMS_PREPARING","message":"الحسابات متاحة، لكن الامتحانات والدفع لم يُفتحا بعد. سنعلن عند إتاحتهما.","message_en":"Accounts are available, but exams and payments have not opened yet. Availability will be announced."}}';
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location = / { try_files /index.html =404; }
    location ~ ^/(login|register|verify-email|exam|dashboard)(/|$) {
        try_files $uri /app.html;
    }
    location / { try_files $uri $uri/index.html =404; }
}
