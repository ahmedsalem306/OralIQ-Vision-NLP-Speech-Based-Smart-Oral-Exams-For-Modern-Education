# Install after DNS validation and frontend certificate issuance.
server {
    listen 80;
    listen [::]:80;
    server_name oralliq.com www.oralliq.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/oraliq-acme; }
    location / { return 301 https://oralliq.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.oralliq.com;
    ssl_certificate /etc/letsencrypt/live/oralliq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oralliq.com/privkey.pem;
    access_log off;
    return 301 https://oralliq.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name oralliq.com;
    ssl_certificate /etc/letsencrypt/live/oralliq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oralliq.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/oraliq-web/current;
    index index.html;
    access_log off;
    client_max_body_size 50m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy 'camera=(self), microphone=(self), geolocation=()' always;
    location /api/ {
        # Remove this operator-owned marker only after candidate/backup/mail checks.
        if (-f /srv/oraliq-web/api-maintenance) { return 503; }
        proxy_pass http://127.0.0.1:18001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy 'camera=(self), microphone=(self), geolocation=()' always;
    }
}
