<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="OralIQ — أول منصة عربية للامتحانات الشفوية أونلاين: الطالب يجاوب بصوته، والإجابة بتتصحح تلقائياً مع التحقق من الهوية ومراقبة النزاهة." />
  <meta name="theme-color" content="#F5F7FA" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0E1422" media="(prefers-color-scheme: dark)" />
  <title>OralIQ — أول منصة عربية للامتحانات الشفوية أونلاين</title>
  <!-- Link previews (WhatsApp, Facebook, Telegram, X) — exam links are mostly shared in class groups -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="OralIQ" />
  <meta property="og:locale" content="ar_EG" />
  <meta property="og:title" content="OralIQ — أول منصة عربية للامتحانات الشفوية أونلاين" />
  <meta property="og:description" content="الطالب يجاوب بصوته، والإجابة بتتصحح لوحدها مع التحقق من الهوية." />
  <meta property="og:image" content="https://oral-iq-vision-nlp-speech-based-sma.vercel.app/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="OralIQ — أول منصة عربية للامتحانات الشفوية أونلاين" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://oral-iq-vision-nlp-speech-based-sma.vercel.app/og.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <script>
    // Apply saved language + theme before first paint to avoid a flash.
    (function () {
      try {
        var lang = localStorage.getItem("oraliq_lang") === "en" ? "en" : "ar";
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        var theme = localStorage.getItem("oraliq_theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
