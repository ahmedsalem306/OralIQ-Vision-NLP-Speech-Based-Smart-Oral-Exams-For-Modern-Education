<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <meta name="theme-color" content="#16100C" media="(prefers-color-scheme: dark)" />

  <meta property="og:title" content="OralIQ — أول منصة عربية للامتحانات الشفوية بالذكاء الاصطناعي" />
  <meta property="og:description" content="امتحانات شفوية أونلاين بدون تدخل الدكتور عبر 3 موديلات ذكاء اصطناعي، مع منع الغش تماماً ببصمة الوجه والصوت." />

  <link rel="preload" href="/fonts/ThmanyahSans-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/ThmanyahSans-Medium.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/ThmanyahSerifDisplay-Bold.woff2" as="font" type="font/woff2" crossorigin />
  <script>
    (function () {
      var de = document.documentElement;
      try {
        var lang = localStorage.getItem("oraliq_lang") === "en" ? "en" : "ar";
        de.lang = lang;
        de.dir = lang === "ar" ? "rtl" : "ltr";
        var theme = localStorage.getItem("oraliq_theme");
        if (theme === "light" || theme === "dark") de.dataset.theme = theme;
      } catch (e) { }
      if (location.pathname === "/") {
        var link = document.createElement("link");
        link.rel = "preload"; link.as = "image"; link.href = "/media/hero-face-mesh-poster.webp";
        link.setAttribute("fetchpriority", "high");
        document.head.appendChild(link);
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
